services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: JARVIS_PROVIDER
        value: gemini
      - key: JARVIS_MODEL
        value: gemini-3.5-flash-lite
      - key: JARVIS_API_KEY
        sync: false   # sır olarak Render panelinden girin
